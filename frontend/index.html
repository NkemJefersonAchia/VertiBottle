<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VertiBottle</title>
<link rel="stylesheet" href="/styles.css">
<script src="/vendor/chart.umd.js"></script>
</head>
<body>

<!-- Login -->
<div id="login-screen" class="login-screen hidden">
  <div class="login-card">
    <div class="logo">
      <span class="logo-mark"></span>
      <h1>VertiBottle</h1>
    </div>
    <p class="login-sub" data-i18n="login_sub">Hydroponic farm monitoring</p>
    <form id="login-form">
      <input type="text" id="login-username" placeholder="Username" data-i18n-placeholder="username" autocomplete="username" required>
      <input type="password" id="login-password" placeholder="Password" data-i18n-placeholder="password" autocomplete="current-password" required>
      <button type="submit" class="btn-primary" data-i18n="sign_in">Sign in</button>
      <p id="login-error" class="login-error hidden"></p>
    </form>
    <div class="login-roles">
      <p data-i18n="try_role">Try a role</p>
      <div class="role-chips">
        <button class="chip" data-user="school_op" data-i18n="chip_school">School operator</button>
        <button class="chip" data-user="cb_op" data-i18n="chip_cb">CB operator</button>
        <button class="chip" data-user="coordinator" data-i18n="chip_coord">Coordinator</button>
        <button class="chip" data-user="agronomist" data-i18n="chip_agro">Agronomist</button>
        <button class="chip" data-user="admin" data-i18n="chip_admin">Administrator</button>
      </div>
    </div>
  </div>
</div>

<!-- App shell -->
<div id="app" class="hidden">
  <header class="topbar">
    <div class="topbar-left">
      <span class="logo-mark small"></span>
      <span class="brand">VertiBottle</span>
    </div>
    <nav class="topnav" id="topnav">
      <a href="#/overview" data-i18n="nav_overview">Overview</a>
      <a href="#/alerts" data-i18n="nav_alerts">Alerts</a>
      <a href="#/ussd" data-i18n="nav_ussd">USSD</a>
      <a href="#/admin" data-i18n="nav_admin" id="nav-admin">Admin</a>
    </nav>
    <div class="topbar-right">
      <button id="lang-toggle" class="lang-toggle" title="Language">FR</button>
      <span id="whoami" class="whoami"></span>
      <button id="logout" class="logout" data-i18n="logout">Log out</button>
    </div>
  </header>

  <div id="banner-area"></div>

  <main id="view"></main>
</div>

<script src="/app.js"></script>
<script type="module" src="/farm3d.js"></script>
</body>
</html>
